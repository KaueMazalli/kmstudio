<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Produto — Minha Loja</title>

    <link rel="stylesheet" href="css/style.css">

    <link
        rel="stylesheet"
        href="css/produto.css"
    >

</head>


<body>


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="site-header">

        <div class="header-container">

            <a
                href="index.html"
                class="logo"
                data-store-name
            >
                Minha Loja
            </a>


            <nav class="main-nav">

                <a href="index.html">
                    Produtos
                </a>


                <a
                    href="carrinho.html"
                    class="cart-link"
                    aria-label="Carrinho"
                >

                    🛒

                    <span class="cart-count">
                        0
                    </span>

                </a>

            </nav>

        </div>

    </header>



    <!-- =====================================================
         PRODUTO
    ====================================================== -->

    <main>

        <section class="product-detail">

            <a
                href="index.html"
                class="back-link"
            >
                ← Voltar para produtos
            </a>


            <div
                id="product-detail-content"
                class="product-detail-grid"
            >
            </div>

        </section>

    </main>



    <!-- =====================================================
         SCRIPTS
    ====================================================== -->

    <script src="js/products.js"></script>

    <script src="js/cart.js"></script>

    <script src="js/main.js"></script>

    <script src="js/produto.js"></script>


</body>

</html>
