<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Carrinho — Minha Loja</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/carrinho.css">

</head>


<body>


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="site-header">

        <div class="header-container">

            <a
                href="index.html"
                class="logo"
                data-store-name
            >
                Minha Loja
            </a>


            <nav class="main-nav">

                <a href="index.html">
                    Produtos
                </a>


                <a
                    href="carrinho.html"
                    class="cart-link"
                    aria-label="Carrinho"
                >

                    🛒

                    <span class="cart-count">
                        0
                    </span>

                </a>

            </nav>

        </div>

    </header>



    <!-- =====================================================
         CARRINHO
    ====================================================== -->

    <main>

        <section class="cart-page">

            <div class="cart-header">

                <span class="section-label">
                    Seu pedido
                </span>


                <h1>
                    Carrinho
                </h1>

            </div>


            <div
                id="cart-content"
                class="cart-content"
            >

                <!-- Conteúdo carregado pelo JavaScript -->

            </div>

        </section>

    </main>



    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <footer class="site-footer">

        <div class="footer-container">

            <strong data-store-name>
                Minha Loja
            </strong>


            <span>
                Faça seu pedido de forma rápida e fácil.
            </span>

        </div>

    </footer>



    <!-- =====================================================
         SCRIPTS
    ====================================================== -->

    <script src="js/products.js"></script>

    <script src="js/cart.js"></script>

    <script src="js/main.js"></script>

    <script src="js/carrinho.js"></script>


</body>

</html>
