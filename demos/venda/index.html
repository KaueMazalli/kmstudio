<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Minha Loja</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="site-header">

        <div class="header-container">

            <a
                href="index.html"
                class="logo"
                data-store-name
            >
                Minha Loja
            </a>


            <nav class="main-nav">

                <a href="index.html">
                    Produtos
                </a>


                <a
                    href="carrinho.html"
                    class="cart-link"
                    aria-label="Carrinho"
                >

                    🛒

                    <span class="cart-count">
                        0
                    </span>

                </a>

            </nav>

        </div>

    </header>



    <!-- =====================================================
         HERO
    ====================================================== -->

    <main>

        <section class="hero">

            <div class="hero-content">

                <span class="hero-label">
                    Qualidade e praticidade
                </span>


                <h1 data-hero-title>
                    Os produtos que chega até você.
                </h1>


                <p data-hero-description>
                    Produtos de qualidade, preços justos e
                    praticidade para fazer seu pedido.
                </p>


                <a
                    href="#produtos"
                    class="btn btn-primary"
                >
                    Ver produtos
                </a>

            </div>

        </section>



        <!-- =================================================
             PRODUTOS
        ================================================== -->

        <section
            class="products-section"
            id="produtos"
        >

            <div class="section-header">

                <span class="section-label">
                    Confira nosso catálogo
                </span>


                <h2>
                    Nossos produtos
                </h2>

            </div>


            <div
                class="products-grid"
                id="featured-products"
            >
            </div>

        </section>

    </main>



    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <footer class="site-footer">

        <div class="footer-container">

            <strong data-store-name>
                Minha Loja
            </strong>


            <span>
                Faça seu pedido de forma rápida e fácil.
            </span>

        </div>

    </footer>



    <!-- =====================================================
         SCRIPTS
    ====================================================== -->

    <script src="js/products.js"></script>

    <script src="js/cart.js"></script>

    <script src="js/main.js"></script>


    <script>

        document.addEventListener(
            "DOMContentLoaded",
            () => {

                const grid =
                    document.getElementById(
                        "featured-products"
                    );


                if (!grid) {
                    return;
                }


                const allProducts =
                    products.filter(
                        product =>
                            product.stock !== false
                    );


                allProducts.forEach(
                    product => {

                        const oldPrice =
                            product.oldPrice
                                ? `
                                    <span class="product-old-price">
                                        R$ ${product.oldPrice
                                            .toFixed(2)
                                            .replace(".", ",")}
                                    </span>
                                  `
                                : "";


                        grid.innerHTML += `

                            <article
                                class="product-card"
                            >

                                <!-- =================================
                                     IMAGEM
                                ================================== -->

                                <a
                                    href="./produto.html?id=${product.id}"
                                    class="product-image-link"
                                    aria-label="Ver ${product.name}"
                                >

                                    <img
                                        src="${product.image}"
                                        alt="${product.name}"
                                        class="product-img"
                                    >

                                </a>


                                <!-- =================================
                                     INFORMAÇÕES
                                ================================== -->

                                <div class="product-info">


                                    <span class="product-category">
                                        ${product.category}
                                    </span>


                                    <a
                                        href="./produto.html?id=${product.id}"
                                        class="product-title-link"
                                    >

                                        <h3 class="product-title">
                                            ${product.name}
                                        </h3>

                                    </a>


                                    <div class="product-price">

                                        R$
                                        ${product.price
                                            .toFixed(2)
                                            .replace(".", ",")}

                                        ${oldPrice}

                                    </div>


                                    <button
                                        type="button"
                                        class="btn btn-primary"
                                        onclick="addToCart(${product.id})"
                                    >
                                        Comprar
                                    </button>

                                </div>

                            </article>

                        `;

                    }
                );

            }
        );

    </script>


</body>

</html>
