<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta name="theme-color" content="#123e78">
    <meta name="description" content="Consulte detalhes de produtos de limpeza da Unishop Vital Clean, em Jales, e fale com a loja pelo WhatsApp.">
    <title>Produto | Unishop Vital Clean</title>

    <link rel="stylesheet" href="css/style.css">

    <link
        rel="stylesheet"
        href="css/produto.css"
    >

</head>


<body>


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="site-header">
        <div class="container header-container">
            <a class="brand" href="index.html" aria-label="Unishop Vital Clean - início">
                <span class="brand-mark">VC</span>
                <span class="brand-name"><strong data-store-name>Unishop Vital Clean</strong><small>Produtos de limpeza</small></span>
            </a>
            <button class="mobile-menu-toggle" type="button" aria-controls="primary-navigation" aria-expanded="false" aria-label="Abrir menu"><span></span><span></span><span></span></button>
            <nav class="main-nav" id="primary-navigation" aria-label="Navegação principal">
                <a href="index.html#categorias">Categorias</a>
                <a href="index.html#produtos">Produtos</a>
                <a href="index.html#sobre">A loja</a>
                <a class="cart-link" href="carrinho.html"><span aria-hidden="true">☷</span> Minha lista <span class="cart-count">0</span></a>
            </nav>
        </div>
    </header>



    <!-- =====================================================
         PRODUTO
    ====================================================== -->

    <main>

        <section class="product-detail">

            <a
                href="index.html"
                class="back-link"
            >
                ← Voltar para produtos
            </a>


            <div
                id="product-detail-content"
                class="product-detail-grid"
            >
            </div>

        </section>

    </main>



    <!-- =====================================================
         SCRIPTS
    ====================================================== -->

    <script src="js/products.js"></script>

    <script src="js/cart.js"></script>


    <script src="js/produto.js"></script>


    <script>
        const menuToggle = document.querySelector(".mobile-menu-toggle");
        const nav = document.getElementById("primary-navigation");
        if (menuToggle && nav) {
            menuToggle.addEventListener("click", function () {
                const isOpen = menuToggle.getAttribute("aria-expanded") === "true";
                menuToggle.setAttribute("aria-expanded", String(!isOpen));
                menuToggle.setAttribute("aria-label", isOpen ? "Abrir menu" : "Fechar menu");
                nav.classList.toggle("is-open", !isOpen);
            });
            nav.querySelectorAll("a").forEach(function (link) {
                link.addEventListener("click", function () {
                    menuToggle.setAttribute("aria-expanded", "false");
                    menuToggle.setAttribute("aria-label", "Abrir menu");
                    nav.classList.remove("is-open");
                });
            });
        }
    </script>
</body>

</html>
