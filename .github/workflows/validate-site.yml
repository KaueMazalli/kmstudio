name: Validate KM Studio pages

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check HTML, local links and sitemap
        run: python scripts/check-site.py
      - name: Check JavaScript syntax
        run: |
          node --check script.js
          find demos -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check
